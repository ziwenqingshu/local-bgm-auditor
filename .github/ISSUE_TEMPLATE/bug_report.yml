name: 问题报告 / Bug report
description: 识别、界面、安装或导出中的问题
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！**请不要上传受版权保护的音乐或包含个人信息的视频。** 安全问题请按 SECURITY.md 私下报告。
  - type: textarea
    id: what
    attributes:
      label: 发生了什么 / What happened
      description: 实际结果与预期结果
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
      placeholder: |
        1. 导入……
        2. 审核……
        3. 看到……
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: 环境 / Environment
      description: 粘贴 `python scripts/check_environment.py` 的输出
      render: text
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: 媒体文件特征 / Media details
      description: 容器、编码、时长、音轨数量等（不要附带文件本身）
  - type: textarea
    id: logs
    attributes:
      label: 错误信息或日志 / Logs
      render: text
