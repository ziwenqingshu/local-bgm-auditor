name: 功能建议 / Feature request
description: 提出新功能或改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题 / Problem
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的方案 / Proposal
  - type: checkboxes
    id: offline
    attributes:
      label: 约束 / Constraints
      options:
        - label: 该功能不要求默认联网、付费服务或 API Key（否则只能作为默认关闭的可选项）
